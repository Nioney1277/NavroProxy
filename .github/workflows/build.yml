name: Desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: nethernet/go.mod
          cache-dependency-path: nethernet/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distributions
        run: bash ./gradlew assemble
        shell: bash
      - name: Protocol and transport regression
        run: >-
          bash ./gradlew test
          --tests 'ac.navro.proxy.NetworkConfigTest'
          --tests 'ac.navro.proxy.ConnectionRoutingTest'
          --tests 'ac.navro.proxy.NativeRakNetForwarderTest'
          --tests 'ac.navro.proxy.nethernet.ConnectionBatchSessionTest'
          --tests 'ac.navro.proxy.nethernet.RakNetFrontendSessionTest'
          --tests 'ac.navro.proxy.nethernet.NetherNetBatchSessionTest'
          --tests 'ac.navro.proxy.nethernet.NetherNetBridgeFramingTest'
          --tests 'ac.navro.proxy.nethernet.NetherNetOfflineLoginUtilityTest'
          --tests 'ac.navro.proxy.check.impl.timer.LiveDetectionTest'
          --tests 'ac.navro.proxy.protocol.*'
          --tests 'ac.navro.proxy.prediction.PredictionSync*'
          --tests 'ac.navro.proxy.prediction.vehicle.*'
          --tests 'ac.navro.proxy.packets.other.Vehicle*'
          --tests 'ac.navro.proxy.nethernet.NetherNetDetectionTest.nativeVehiclePacketsReachPredictionAndEmitVehicleCorrection'
          --tests 'ac.navro.proxy.packets.input.AuthInputPacketsTest'
          --tests 'ac.navro.proxy.teleport.NavroCorrectionAlignmentTest'
          --tests 'ac.navro.proxy.state.MovementMetadataLifecycleTest'
          --tests 'ac.navro.proxy.state.MovementStateReferenceTest'
          --tests 'ac.navro.proxy.command.*'
          --tests 'ac.navro.proxy.check.impl.sprint.SprintChecksTest'
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: navro-proxy-${{ matrix.os }}
          path: build/distributions/*.zip
  nethernet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: windows-latest
            suffix: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nethernet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nethernet/go.mod
          cache-dependency-path: nethernet/go.sum
      - run: go test ./...
      - name: Build listener and probe
        run: |
          go build -o bin/navro-nethernet${{ matrix.suffix }} ./inspect
          go build -o bin/navro-nethernet-probe${{ matrix.suffix }} ./probe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: navro-nethernet-${{ matrix.os }}
          path: nethernet/bin/*
