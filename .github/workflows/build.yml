name: Desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distributions
        run: bash ./gradlew assemble
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: navro-proxy-${{ matrix.os }}
          path: build/distributions/*.zip
  nethernet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: windows-latest
            suffix: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nethernet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nethernet/go.mod
          cache-dependency-path: nethernet/go.sum
      - name: Build listener and probe
        run: |
          go build -o bin/navro-nethernet${{ matrix.suffix }} ./inspect
          go build -o bin/navro-nethernet-probe${{ matrix.suffix }} ./probe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: navro-nethernet-${{ matrix.os }}
          path: nethernet/bin/*
