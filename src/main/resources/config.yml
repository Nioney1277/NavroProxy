# This contains the anti-cheat related configurations.

# This prefix is used in all Navro messages.
prefix: "&aNavro &7>&r "

# How many ticks of history are contained in the client's rolling window for use when receiving corrections.
# At 20 ticks per second a history size of 40 means that a correction could still be processed with rewind with
# two seconds of two-way latency
# NOTE: This is not "that" important on Navro.
player-rewind-history-size-ticks: 20
  
# Enable smooth movement setbacks using CorrectPlayerMovePredictionPacket.
# false uses a MovePlayer teleport, restores validated velocity and waits for target confirmation.
# Vehicle movement always uses the dedicated vehicle prediction correction.
smooth-setback: false

# This is the tolerance of discrepancies between the Client and Server Player position. This helps prevent sending corrections too frequently
# NOTE: Again, Navro can handle small offset just fine and does account for lag, however keep in mind that Navro can't handle (that well)
# any offset smaller than 5.0E-5
player-position-acceptance-threshold: 1.0E-4

# This is the max reach that Navro tolerates before flagging.
max-tolerance-compensated-reach: 3.005

# How many discrepancies between the Client and Server Player position needed to be before the anticheat send alert message
# NOTE: This is NOT tolerance of discrepancies (that's player-position-acceptance-threshold), this will still do silent
# correction unless you change player-position-acceptance-threshold.
# This configuration exists so that some falses or other stuff won't keep spamming the chat/logs.
differ-till-alert: 0.0

# Checks that you want Navro to disable.
# Check name should be in format "Name-Type" and if there is no type then "Name", ex: Reach-A (don't actually disable reach check lol).
# Reach checks attack distance; Hitboxes checks whether the entity ray hits at all.
# Interact-A checks quick loot using slot distance and recent click intervals.
# Bad Packet-C (displayed as BadPacketsC) checks client tick ordering.
# BadPacketsC and the previous ClientTickOrder disable keys are also accepted.
disabled-checks: []

# Diagnostic quick-loot packet, skip-reason and timing logs in the server console.
interact-a-debug: false

# RotationPlace uses the next input's interactRotation and the preceding two raw input positions.
# Origins cover the continuous position segment; turning does not exempt a placement.
# Disable independently with RotationPlace in disabled-checks.
rotation-place:
    debug: false

# ClientA-F account association checks. Actions apply only to the connecting player.
# action: record = save only; alert = save and flag; kick = save, flag and disconnect.
# Per-check action: inherit uses this default. Apply changes with /navro reload.
client-checks:
    enabled: true
    action: alert
    kick-message: "Client account association detected (%check%)"
    # Maximum historical accounts probed per login; most recently seen accounts come first.
    probe-limit: 256
    scan-timeout-ticks: 600
client-a: # DeviceId
    enabled: true
    action: inherit
    min-linked-accounts: 1
client-b: # ClientRandomId; ignore zero and other placeholder values.
    enabled: true
    action: inherit
    min-linked-accounts: 1
client-c: # SelfSignedId
    enabled: true
    action: inherit
    min-linked-accounts: 1
client-d: # NetworkID; NetherNet connections only. RakNet connections are skipped.
    enabled: true
    action: inherit
    min-linked-accounts: 1
client-e: # Resource pack cache; sends a minimal account fingerprint pack during login.
    enabled: true
    action: inherit
    min-linked-accounts: 1
    require-resources: true
    # Action for claiming a newly generated pack is cached or completing an invalid handshake.
    spoof-action: inherit
client-f: # Blob cache; clients without cache support are skipped.
    enabled: true
    action: inherit
    min-linked-accounts: 1

# Inventory-A checks armor equip intervals; logical slot ids cannot provide a reliable cursor distance.
inventory-a:
    min-interval-ms: 100
    buffer-threshold: 2
    reset-after-ms: 2000
    cancel-transaction: true

# Chat checks. Disable independently with Spammer-A / Spammer-B / Spammer-C / Spammer-D / Spammer-E.
# Each violation adds a VL. cancel-message: false keeps alerts but allows the message.
spammer-a:
    # The sixth message within 250ms (5 ticks at 50ms each) flags.
    window-ms: 250
    max-messages: 5
    cancel-message: true
spammer-b:
    # Five messages produce four intervals; allow ordinary packet-arrival jitter up to 100ms.
    messages: 5
    interval-tolerance-ms: 100
    max-interval-ms: 30000
    cancel-message: true
spammer-c:
    # Count consecutive equal Unicode characters after removing formatting/invisible codes.
    repeat-length: 8
    cancel-message: true
spammer-d:
    # Check every message independently, including random segments inside ordinary text.
    # Accumulate suspicious messages without time expiry. Normal messages leave the count unchanged.
    messages: 3
    min-segment-length: 12
    cancel-message: true
spammer-e:
    # Compare all positions against the last 10 messages; a shared continuous segment flags.
    min-common-length: 12
    history-messages: 10
    cancel-message: true

# Independent Flower target-context checks; attacks trigger inference, accepted rotations and target poses fill the windows.
# Only completed inference can add a VL.
# Aim-1 uses 64 frames; Aim-2 uses 128 frames. Disable either in disabled-checks.
# Example: Aim (1) ML aim detection probability=99.99%
aim-1:
    threshold: 0.75
    interval-ticks: 64
aim-2:
    threshold: 0.75
    interval-ticks: 128
aim-ai:
    # Shared arrival-gap reset. Legacy threshold/interval-ticks remain fallbacks.
    max-wall-gap-ms: 250

# Normally Navro will account for lag, that also including block, if on the server side the block below player is Air but if
# on the client side, it's an actual block, then Navro will account for this. However, with this enable, Navro will forcefully
# rewind player if player is standing on a desynced block, this for ex: prevent player from abusing high ping to climb up walls in
# region that doesn't allow block placing (ex: WorldEdit).

# NOTE: This will only take effect if player is STANDING on the block.
ignore-desynced-block: false

# How long do we wait for player to respond to latency confirmation/acknowledgements till we kicked the player for timed out.
# This value shouldn't be too low to account for lagging player and shouldn't be too high so cheaters won't be able to stop responding to latency for too long.
max-latency-wait: 15000

# How much balance advantage (in milliseconds) player can gain before the anticheat forcefully set player back (regardless if the player is lagging or not)
# This is to prevent lagging player (or cheaters pretend to be one) gain too much advantage by.... lagging.
# To disable (which you probably shouldn't), set this to any value smaller or equals to 0.
max-balance-advantage: 8500

# Record raw inputs and collision stops near wooden fences in fence-samples/*.jsonl.
# Console output is limited to fence contact summaries and prediction discrepancies.
fence-sampling: true

# Record raw inputs, chest heights, pairing and collision results in chest-samples/*.jsonl.
chest-sampling: true

# Record lava flow, sneak input, velocity stages and collision results in lava-samples/*.jsonl.
lava-sampling: true

# Record head contact, depenetration state and jump movement near overhead blocks.
ceiling-sampling: true

# Record side block shapes, horizontal collision, rewind solves and sent corrections.
collision-sampling: true

# Record teleport lifecycle and residuals >= 1e-5, with 24 preceding and 120 following inputs.
# Also retain every movement-exempt input and the transition back to checked movement.
# Diagnostic threshold only; no effect on movement checks or acceptance.
movement-sampling: true

# Record swimming inputs, water sensing, pose, motion, checks and corrections.
# Full stages go to swim-samples/*.jsonl; results/failures also use [swim-debug] in console.
swim-debug: false

# Item-use state, input slowdown, metadata and NetworkStackLatency ACK diagnostics.
# JSONL: item-use-samples/; violations and corrections also appear in console.
item-use-debug: false

# Experimental metadata history routing for local item-use diagnostics. This is
# not a complete item-use reconciliation fix; keep disabled in production.
item-use-metadata-frame-experiment: false
