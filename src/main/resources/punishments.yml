# Each section below belongs to one implemented check; its VL is counted separately.
# Format: "threshold:interval action". 100:0 runs once at 100 recent VL;
# 100:50 runs at 100, 150, 200... A completely expired window resets actions.
# Available actions: [alert], [log], kick %player% [optional message].
# Kick runs directly in the proxy; arbitrary backend commands are not supported.
# Reload or reconnect resets punishment counters. remove-violations-after is seconds.
# Name matching is case-insensitive; * matches any characters, ! excludes a name.
# Keep one exact selector per section for independent per-check thresholds.
# All checks below alert by default; uncomment a kick line to enable it for that check.
Punishments:
  Timer:
    remove-violations-after: 300
    checks: ["Timer"]
    commands:
      - "1:1 [alert]"
      # - "100:0 kick %player%"

  NegativeTimer:
    remove-violations-after: 300
    checks: ["NegativeTimer"]
    commands:
      - "1:1 [alert]"
      # - "100:0 kick %player%"

