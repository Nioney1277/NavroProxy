# Display text only. Reload all three configuration files with /navro reload.
# Color codes use &. Values substituted from players/checks are not reinterpreted.
prefix: "&aNavro &7>&r "

# %message% preserves Navro's detailed original check output.
# Also available: %player%, %check_name%, %check%, %vl%, %check_vl%,
# %verbose%, %experimental%. %vl% is the punishment group's recent count;
# %check_vl% is the individual check's session count.
alerts-format: "%prefix%&3%message%"

alerts-enabled: "%prefix%&fEnabled alerts."
alerts-disabled: "%prefix%&fDisabled alerts."
alerts-save-failed: "%prefix%&cCould not save alerts preference."
no-permission: "&cYou do not have permission to use this command."
reloaded: "%prefix%&fReloaded config! New config: %config%"
reload-failed: "%prefix%&cCould not reload config: %error%"
player-not-found: "%prefix%&cFailed to find player session."
debug-enabled: "%prefix%&fEnabled %mode% for %player%."
debug-disabled: "%prefix%&fDisabled %mode% for %player%."
unknown-subcommand: "%prefix%Unknown subcommand."
usage: "%prefix%Usage: /navro %usage%"

# Used when a kick action has no explicit reason.
kick-message: "%prefix%&cDisconnected for %check_name% violations."
disconnect-timeout: "Timed out!"

# Internal input validation: negative client frames are impossible.
disconnect-invalid-tick: "Impossible tick id=%tick%"
