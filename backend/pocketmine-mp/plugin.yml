name: NavroBridge
version: 1.1.0
main: ac\navro\bridge\NavroBridge
api: [5.0.0]
description: Bridges NavroProxy alerts, server state and private authenticated RakNet on PocketMine-MP-NG
softdepend: [Customies, Customies-NG]
commands:
  navro:
    description: Manage NavroProxy alerts and diagnostics
    usage: "/navro <alert|reload|debug|debug2>"
    aliases: [navroalerts]
    permission: navrobridge.command
permissions:
  navrobridge.command:
    description: Access the Navro command
    default: true
  navrobridge.alerts:
    description: Receive NavroProxy alerts in chat
    default: op
  navrobridge.reload:
    description: Reload Navro bridge alert and trusted proxy settings
    default: op
