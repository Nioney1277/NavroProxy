name: NavroBridge
version: 1.2.0
main: ac\navro\bridge\NavroBridge
api: [5.0.0]
description: Bridges NavroProxy alerts, server state and private authenticated RakNet on PocketMine-MP-NG
softdepend: [Customies, Customies-NG]
commands:
  navro:
    description: NavroProxy alert and debug management
    usage: "/navro alert | reload | debug <player> | debug2 [player] | proxyping [player]"
    permission: navrobridge.command
permissions:
  navrobridge.command:
    description: View the Navro command
    default: true
  navrobridge.debug:
    description: View NavroProxy prediction debug output
    default: op
  navrobridge.reload:
    description: Reload NavroProxy configuration
    default: op
  navrobridge.alerts:
    description: Receive NavroProxy alerts in chat
    default: op
  navrobridge.proxyping:
    description: View proxy forwarding latency
    default: op
