name: NavroFireworkBridge
main: ac.navro.bridge.nukkit.NavroFireworkBridge
version: 0.4.0
api: ["1.0.14"]
load: POSTWORLD
author: NavroProxy
description: Bridges NavroProxy alerts, native server state, inventories and fireworks on Nukkit-MOT.
commands:
  navroalerts:
    description: Toggle your NavroProxy alerts in chat
    usage: "/navroalerts"
    permission: navrobridge.alerts
permissions:
  navrobridge.alerts:
    description: Receive NavroProxy alerts in chat
    default: op
